version: '3.8'

services:
  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: garage_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: garage_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - garage-network

  # Node.js Backend Service
  backend:
    build: ./backend
    container_name: garage_backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules  # Prevent host node_modules override
    environment:
      - NODE_ENV=development  # Allow dev dependencies
    depends_on:
      - db
    command: sh -c "npx wait-on tcp:db:3306 && npm run dev"
    env_file:
      - ./backend/.env

    networks:
      - garage-network

  # Frontend Service (Static Files)
  frontend:
    image: nginx:alpine
    build: ./frontend
    container_name: garage_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - garage-network

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend/build:/usr/share/nginx/html
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend
    networks:
      - garage-network

networks:
  garage-network:
    driver: bridge

volumes:
  db_data: