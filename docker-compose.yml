version: '3.8'

services:
  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: garage_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: garage_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/1_init.sql
      - ./database/migrations/create_default_secretary.sql:/docker-entrypoint-initdb.d/2_create_secretary.sql
    networks:
      - garage-network
    healthcheck:  # Add healthcheck
      test: ["CMD-SHELL", "mysqladmin ping -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Node.js Backend Service
  backend:
    build: ./backend
    container_name: garage_backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules  # Prevent host node_modules override
    environment:
      - NODE_ENV=development  # Allow dev dependencies
      - NODE_OPTIONS=--max-old-space-size=512  # Increase Node.js memory limit
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    depends_on:
      - db
    command: sh -c "npx wait-on tcp:db:3306 && npm run dev"
    env_file:
      - ./backend/.env
    restart: unless-stopped  # Add automatic restart

    networks:
      - garage-network

  # Frontend Service (Static Files)
  frontend:
    build: ./frontend
    container_name: garage_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - garage-network

networks:
  garage-network:
    driver: bridge

volumes:
  db_data: